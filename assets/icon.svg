<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Sonora app icon source. macOS grid: 824pt plate inset 100pt, ~185pt corner radius. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34312D"/>
      <stop offset="0.55" stop-color="#211F1D"/>
      <stop offset="1" stop-color="#171615"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#8FDCC0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8FDCC0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B4EFD8"/>
      <stop offset="1" stop-color="#6FCBA9"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>

  <!-- Selection wash -->
  <rect x="330" y="292" width="364" height="440" rx="26" fill="#8FDCC0" fill-opacity="0.08"/>

  <!-- Waveform bars outside the selection (dim ivory) -->
  <g fill="#F3EEE3" fill-opacity="0.24">
    <rect x="216" y="474" width="26" height="76" rx="13"/>
    <rect x="266" y="436" width="26" height="152" rx="13"/>
    <rect x="732" y="420" width="26" height="184" rx="13"/>
    <rect x="782" y="466" width="26" height="92" rx="13"/>
  </g>

  <!-- Waveform bars inside the selection (mint) -->
  <g fill="url(#mint)">
    <rect x="356" y="400" width="26" height="224" rx="13"/>
    <rect x="406" y="330" width="26" height="364" rx="13"/>
    <rect x="456" y="384" width="26" height="256" rx="13"/>
    <rect x="506" y="306" width="26" height="412" rx="13"/>
    <rect x="556" y="364" width="26" height="296" rx="13"/>
    <rect x="606" y="420" width="26" height="184" rx="13"/>
    <rect x="656" y="452" width="26" height="120" rx="13"/>
  </g>

  <!-- Trim handles -->
  <g fill="#8FDCC0">
    <rect x="318" y="282" width="10" height="460" rx="5"/>
    <rect x="696" y="282" width="10" height="460" rx="5"/>
  </g>
  <g fill="#F3EEE3">
    <rect x="311" y="470" width="24" height="84" rx="12"/>
    <rect x="689" y="470" width="24" height="84" rx="12"/>
  </g>
</svg>
