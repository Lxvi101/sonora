name: CI
on:
  push:
    branches: [main]
    paths-ignore: [appcast.xml]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy && rustup default 1.98.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-${{ runner.arch }}-rust-1.98.1-${{ hashFiles('Cargo.lock', 'build.rs', 'native/**', 'scripts/build-lame.sh') }}
      - run: cargo fetch --locked
      - run: cargo fmt --check
      - run: cargo clippy --locked --offline --all-targets -- -D warnings
      - run: cargo test --locked --offline
      - name: Validate release metadata and shell scripts
        run: |
          python3 scripts/check-release.py
          bash -n scripts/*.sh
      - name: Build development app (no upstream updater)
        run: ./scripts/bundle.sh
      - name: Archive development app
        run: ditto -c -k --sequesterRsrc --keepParent dist/Sonora.app dist/Sonora-development.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sonora-development-${{ runner.arch }}
          path: dist/Sonora-development.zip
          retention-days: 7
