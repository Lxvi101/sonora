[package]
name = "sonora"
version = "0.1.0"
edition = "2024"
description = "A small native macOS audio editor"
license = "MIT"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders", "font-kit"] }
anyhow = "1"

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
